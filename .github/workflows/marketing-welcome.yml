name: Processar boas-vindas da newsletter
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-welcome
  cancel-in-progress: false
jobs:
  welcome:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MARKETING_WELCOME_CRON_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar segredo
        env:
          CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure MARKETING_CRON_SECRET nos Secrets do GitHub."
            exit 1
          fi
      - name: Executar rotina autenticada
        env:
          CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          http="$(curl --silent --show-error --max-time 120 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Accept: application/json' \
            'https://app.dianavoltolini.com.br/api/marketing/welcome/run')"
          if [ "$http" != "200" ]; then
            echo "::error::Falha no processamento de boas-vindas (HTTP $http)."
            exit 1
          fi
          node -e "const f=require('fs'); let d; try{d=JSON.parse(f.readFileSync('response.json','utf8'))}catch{console.error('Resposta não é JSON');process.exit(1)} if(typeof d.sent!=='number'||typeof d.failed!=='number'){console.error('Resposta inesperada');process.exit(1)} console.log(JSON.stringify({sent:d.sent,failed:d.failed}));"
