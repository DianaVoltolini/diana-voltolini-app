name: Validate public suggestions change
on:
  push:
    branches:
      - feat/admin-content-suggestions
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile project
        run: npm run build
