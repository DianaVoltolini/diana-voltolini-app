name: Processar fila de campanhas manuais

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-manual-queue
  cancel-in-progress: false

jobs:
  call-worker:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MARKETING_QUEUE_CRON_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar segredo configurado
        env:
          QUEUE_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
        run: |
          if [ -z "$QUEUE_SECRET" ]; then
            echo "::error::Configure o secret MARKETING_CRON_SECRET no GitHub Actions."
            exit 1
          fi
      - name: Acionar fila autenticada
        env:
          QUEUE_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 120 \
            -o response.json -w '%{http_code}' \
            --header "Authorization: Bearer ${QUEUE_SECRET}" \
            --header 'Accept: application/json' \
            'https://app.dianavoltolini.com.br/api/marketing/manual-queue/run')"
          if [ "$code" != "200" ]; then
            echo "::error::Falha ao acionar fila (HTTP $code). Verifique as configurações da Hostinger."
            exit 1
          fi
          node -e "const f=require('fs'); const d=JSON.parse(f.readFileSync('response.json','utf8')); if (typeof d.enabled!=='boolean') process.exit(1); console.log(JSON.stringify({enabled:d.enabled,processed:d.processed,accepted:d.accepted,failed:d.failed,skipped:d.skipped}));"
