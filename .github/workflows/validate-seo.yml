name: Validate SEO changes

on:
  push:
    branches:
      - feat/blog-seo-fields-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
