# .github/workflows/verify-ebook-client-access.yml
name: Verify ebook client access
on:
  push:
    branches:
      - feature/ebook-client-access
  pull_request:
    paths:
      - "app/painel/ebooks/**"
      - "app/painel/outros-produtos/**"
      - "app/painel/encontro-online/**"
      - "app/painel/minhas-compras/**"
      - "app/painel/customer-sidebar.tsx"
      - "app/painel/layout.tsx"
      - "app/painel/page.tsx"
      - "supabase/migrations/20261112_encounter_attendance_confirmation.sql"
      - "supabase/migrations/20261112_encounter_attendance_awareness_reminders.sql"
      - "app/api/ebooks/**"
      - "app/api/encounters/**"
      - "app/api/commerce-v2/**"
      - "lib/commerce-v2/**"
      - "supabase/migrations/20261112_encounter_materials.sql"
      - "supabase/migrations/20261112_encounter_reminder_dispatches.sql"
      - "lib/encounters/**"
      - ".github/workflows/encounter-online-reminder.yml"
      - "tests/individual-ebook-encounter-products.test.mjs"
      - "tests/encounter-page-visual-parity.test.mjs"
      - "lib/ebooks/purchase-access.ts"
      - "lib/ebooks/access.ts"
      - "tests/ebook-civil-expiry.test.mjs"
      - "app/torre/comercio-v2/produtos/**"
      - "app/torre/comercio-v2/materiais/**"
      - "supabase/migrations/20261112_commerce_v2_student_delivery_planning.sql"
      - "tests/commerce-v2-student-materials.test.mjs"
      - "tests/commerce-v2-material-eligibility.test.mjs"
      - "supabase/migrations/20261113_commerce_v2_customer_delivery_bridge.sql"
      - "tests/commerce-v2-customer-delivery.test.mjs"
      - "app/torre/produtos-entregas/**"
      - "app/torre/sidebar.tsx"
      - "supabase/migrations/20261113_legacy_ebook_library_transfer.sql"
      - "tests/legacy-ebook-v2-consolidation.test.mjs"
      - "supabase/migrations/20261113_commerce_v2_material_product_eligibility.sql"
      - ".github/workflows/verify-ebook-client-access.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/individual-ebook-encounter-products.test.mjs
      - run: node --test tests/encounter-page-visual-parity.test.mjs
      - run: node --test tests/commerce-v2-student-materials.test.mjs
      - run: node --test tests/commerce-v2-material-eligibility.test.mjs
      - run: node --test tests/ebook-civil-expiry.test.mjs
      - run: node --test tests/commerce-v2-customer-delivery.test.mjs
      - run: node --test tests/legacy-ebook-v2-consolidation.test.mjs
      - run: npm run lint
      - run: npm run build
