name: Security patch Next 16.4.3
on:
  push:
    branches:
      - security/next-16-4-3-20261026

permissions:
  contents: write

jobs:
  patch-and-build:
    if: "!contains(github.event.head_commit.message, '[security-lockfile]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh Next.js and its lockfile
        run: npm install --save-exact next@16.4.3 eslint-config-next@16.4.3
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: patch Next.js to 16.4.3 [security-lockfile]"
            git push
          fi
